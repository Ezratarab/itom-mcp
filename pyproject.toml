[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itom-mcp"
version = "1.0.0"
description = "Secure, read-only-by-default MCP server for ServiceNow ITOM (CMDB, Discovery, Event Management, Service Mapping, MID Servers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "uvicorn>=0.32",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
itom-mcp = "itom_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/itom_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
