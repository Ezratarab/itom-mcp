name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked deps, hashes required)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-asyncio respx
      - name: Tests
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static analysis (bandit)
        run: |
          python -m pip install bandit
          bandit -q -r src
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock --require-hashes --disable-pip --no-deps
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No hidden Unicode in source (Trojan Source)
        run: |
          python - <<'EOF'
          import pathlib, sys, unicodedata
          bad = []
          for p in [*pathlib.Path("src").rglob("*.py"), *pathlib.Path("tests").rglob("*.py")]:
              for n, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if any(unicodedata.category(c) in ("Cf", "Co", "Cs") for c in line):
                      bad.append(f"{p}:{n}")
          if bad:
              print("Hidden/bidi Unicode found:", *bad, sep="\n  ")
              sys.exit(1)
          EOF
