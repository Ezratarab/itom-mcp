# EXAMPLE ONLY. Do not commit real values. Prefer creating the secret with `oc create secret`
# (see README) or from your vault (External Secrets / Sealed Secrets).
# Values are mounted as files and read through the *_FILE variables.
apiVersion: v1
kind: Secret
metadata:
  name: itom-mcp-secrets
  labels:
    app: itom-mcp
type: Opaque
stringData:
  servicenow-username: "itom.mcp.integration"
  servicenow-password: "change-me"
  # One line per MCP client: <client-name>:<token>   (token: openssl rand -hex 32)
  mcp-auth-tokens: |
    claude-desktop:replace-with-64-hex-chars
    dify:replace-with-another-64-hex-chars
  # oauth:
  # servicenow-client-id: ""
  # servicenow-client-secret: ""
