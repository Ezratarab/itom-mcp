# Ingress: only the OpenShift router and pods in this namespace.
# Egress: DNS and HTTPS only (to ServiceNow). Tighten the 443 rule to your instance's CIDRs / egress proxy if you can.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: itom-mcp
spec:
  podSelector:
    matchLabels:
      app: itom-mcp
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: itom-mcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: itom-mcp
